dataset: dnnv
dataset_dirname: dnnv_fnn_new
csv_dirname: csv_fnn_vary_heuristic
input_dataset: mnist

n_test_fallback: 4
checkpoint_postfix: 11

seed: 3636

batch_size: 512
actor_lr: 0.0004
q_lr: 0.0004
# device: cuda:0
n_save_checkpoint: 10000
n_grad_accum: 8

n_input: 4
n_max_step: 500


use_attack: true
dnnv_solver_batch: 500
dnnv_skip_lower_bound: -10
n_max_remaining_subproblem: 3000
n_max_visited_subproblem: 5000

n_train_epoch: 10000
n_train_instance: 200
n_test_instance: 500
n_start_learning: 1000

enc_dec_type: lstm
n_enc_dec_layer: 1
n_hidden: 256
n_buffer: 100000

n_qf_optimize: 2

use_embedding: true
use_zero_embedding: false
use_scale_action: true

# use_early_stop: false
max_runtime: 120.0

save_csv: true
