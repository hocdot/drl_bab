dataset: dnnv

batch_size: 1000
actor_lr: 0.001
q_lr: 0.001
device: cuda:0

n_input: 4
n_max_step: 500

use_attack: false
dnnv_solver_batch: 1000
dnnv_skip_lower_bound: -10
n_max_remaining_subproblem: 1000
n_max_visited_subproblem: 2000

n_train_epoch: 3
n_train_instance: 624
n_test_instance: 100

n_start_learning: 8000
n_start_save_offline_data: 2000
save_offline_data: true

enc_dec_type: lstm
n_enc_dec_layer: 1
n_buffer: 100000

use_embedding: true
use_scale_action: true
